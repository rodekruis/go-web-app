name: 'Build NRW Frontend'
description: Builds the NRW standalone frontend and prepares the output for Azure SWA deployment.

inputs:
  buildOutputDir:
    description: Directory where the build output is written.
    required: false
    default: 'build'

outputs:
  build_version:
    description: Specific version of the built frontend.
    value: ${{ steps.build-version.outputs.build_version }}

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build
      shell: bash
      run: pnpm build

    - name: Set VERSION of build/deployment
      id: build-version
      shell: bash
      run: |
        BUILD_VERSION=$(git describe --tags --dirty --broken 2>/dev/null || git rev-parse --short HEAD)
        echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT
        echo "$BUILD_VERSION" >> ${{ inputs.buildOutputDir }}/VERSION.txt
        echo '{"schemaVersion": 1,"label":"build","message":"'"$BUILD_VERSION"'"}' >> ${{ inputs.buildOutputDir }}/VERSION.json

    - name: Add SWA routing config
      shell: bash
      run: |
        cat > ${{ inputs.buildOutputDir }}/staticwebapp.config.json << 'EOF'
        {
            "$schema": "https://json.schemastore.org/staticwebapp.config.json",
            "navigationFallback": {
                "rewrite": "/index.html",
                "exclude": [
                    "*.{js,json,css,map,jpg,jpeg,png,svg,ico,webmanifest,woff,woff2,txt,gz,br}"
                ]
            },
            "trailingSlash": "auto",
            "globalHeaders": {
                "Cross-Origin-Opener-Policy": "same-origin",
                "Permissions-Policy": "document-domain=(), storage-access=(self), attribution-reporting=(), interest-cohort=(), browsing-topics=()",
                "Referrer-Policy": "same-origin",
                "Strict-Transport-Security": "max-age=31536000; includeSubDomains"
            }
        }
        EOF

    - name: Output build contents
      shell: bash
      run: ls -la ${{ inputs.buildOutputDir }}/
